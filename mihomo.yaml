rule-anchor:
  P: &P {type: http, interval: 86400, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, proxy: Direct}
  # 规则集
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}

proxy-providers:
  MirageGate: {<<: *P, url: "订阅URL"}

proxies:
  - {name: Direct, type: direct, udp: true}
  
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

tun:
  enable: true
  stack: mips   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - cn_ip

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,microsoftcn_domain":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
    - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  nameserver:
    - 10.0.0.1:5225
  fallback:
    - https://8.8.8.8/dns-query#默认代理
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain
    - rule-set:microsoftcn_domain
    
proxy-groups:
  - {name: Proxy, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Flight.png"}
  - {name: Game, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Game.png"}
  - {name: Bilibili, type: select, proxies: [Direct, Proxy], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Bilibili_blue.png"}
  - {name: StarlinkHub, type: select, proxies: [Direct, Proxy], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Home.png"}
  - {name: AI, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/AI_Tree.png"}
  - {name: Twitter, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Twitter.png"}
  - {name: YouTube, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/YouTube.png"}
  - {name: Stream, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Stream.png"}
  - {name: Social, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/SNS.png"}
  - {name: Bahamut, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Bahamut_i.png"}
  - {name: PayPal, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/PayPal.png"}
  - {name: Google, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Google.png"}
  - {name: Microsoft, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Microsoft.png"}
  - {name: Final, type: select, proxies: [Auto], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Fish_b.png"}
  - {name: Auto, type: url-test, include-all: true, tolerance: 20, interval: 300, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/main/Icon/Color/Large/Magic_Timer.png"}
  
rules:
  - AND,((RULE-SET,geolocation-!cn),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - RULE-SET,private_ip,Direct,no-resolve
  - RULE-SET,private_domain,Direct
  - RULE-SET,category-games-cn,Direct
  - RULE-SET,category-games-!cn,Game
  - RULE-SET,bilibili_domain,Bilibili
  - RULE-SET,starlinkhub,StarlinkHub
  - RULE-SET,direct_domain,Direct
  - RULE-SET,ai,AI
  - RULE-SET,twitter_domain,Twitter
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,tiktok_domain,Stream
  - RULE-SET,netflix_domain,Stream
  - RULE-SET,disney_domain,Stream
  - RULE-SET,spotify_domain,Stream
  - RULE-SET,twitch_domain,Stream
  - RULE-SET,discord_domain,Social
  - RULE-SET,instagram_domain,Social
  - RULE-SET,pixiv_domain,Social
  - RULE-SET,telegram_domain,Social
  - RULE-SET,line_domain,Social
  - RULE-SET,reddit_domain,Social
  - RULE-SET,linkedin_domain,Social
  - RULE-SET,facebook_domain,Social
  - RULE-SET,proxy_domain,Proxy
  - RULE-SET,bahamut_domain,Bahamut
  - RULE-SET,paypal_domain,PayPal
  - RULE-SET,google_domain,Google
  - RULE-SET,microsoftcn_domain,Direct
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,geolocation-!cn,Proxy
  - RULE-SET,twitter_ip,Twitter,no-resolve
  - RULE-SET,netflix_ip,Stream,no-resolve
  - RULE-SET,telegram_ip,Social,no-resolve
  - RULE-SET,facebook_ip,Social,no-resolve
  - RULE-SET,google_ip,Google,no-resolve
  - RULE-SET,cn_ip,Direct,no-resolve
  - MATCH,Final
  
